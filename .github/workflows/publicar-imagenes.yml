name: Construir y publicar imagenes Docker en GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend-angular/**"
      - "usuarios-service/**"
      - "foro-service/**"
      - ".github/workflows/publicar-imagenes.yml"

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: "${{ matrix.servicio }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: frontend
            contexto: frontend-angular
          - servicio: usuarios
            contexto: usuarios-service
          - servicio: foro
            contexto: foro-service
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de propietario en minusculas
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.contexto }}
          file: ./${{ matrix.contexto }}/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/foro-fullstack3-${{ matrix.servicio }}:latest
