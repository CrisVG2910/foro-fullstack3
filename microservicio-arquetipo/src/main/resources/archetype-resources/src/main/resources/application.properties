# Se procesa con Velocity al generar el proyecto. `dollar` conserva los placeholders Spring.
#set( $dollar = '$' )
spring.application.name=${dollar}{APP_NAME:${artifactId}}
server.port=${dollar}{PORT:${servicePort}}
spring.datasource.url=${dollar}{DB_URL}
spring.datasource.username=${dollar}{DB_USER}
spring.datasource.password=${dollar}{DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
